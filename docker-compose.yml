version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/infrastructure/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: wagering_localstack
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      - SERVICES=sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh


  app-1:
    build: .
    container_name: wagering_app_1
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wagering_db
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - SQS_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy

  app-2:
    build: .
    container_name: wagering_app_2
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wagering_db
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - SQS_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - '3002:3000'
    depends_on:
      postgres:
        condition: service_healthy

  app-3:
    build: .
    container_name: wagering_app_3
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/wagering_db
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - SQS_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    ports:
      - '3003:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
